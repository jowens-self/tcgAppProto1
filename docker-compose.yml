services:
  db:
    image: postgres:16
    container_name: cardtracker-db
    environment:
      POSTGRES_DB: cardtracker
      POSTGRES_USER: cardtracker
      POSTGRES_PASSWORD: localdev
    ports:
      - "5432:5432"
    volumes:
      - cardtracker-data:/var/lib/postgresql/data
      - ./sql/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro

volumes:
  cardtracker-data:
